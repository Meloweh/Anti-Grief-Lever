#Maximum distance in blocks from a lever to any edge of its protection region.
# Default: 96
# Range: 1 ~ 1024
maxProtectionRadius = 96
#Prevents shulker boxes and supported Sophisticated Backpacks items from being inserted into ender chests.
restrictPortableStorageInEnderChests = true
#How many minutes a player finder compass tracks its target after activation.
# Default: 3
# Range: 1 ~ 1440
playerFinderActiveMinutes = 5
#How often, in seconds, an active player finder reports its remaining time and plays a tick sound.
# Default: 60
# Range: 1 ~ 3600
playerFinderUpdateSeconds = 60
#Player-wide cooldown in Minecraft days after a player finder tracking cycle ends.
# Default: 10
# Range: 0 ~ 3650
playerFinderCooldownDays = 10
#How many minutes a copper compass tracks active Anti-Grief Levers after activation.
# Default: 3
# Range: 1 ~ 1440
copperCompassActiveMinutes = 3
#How often, in seconds, an active copper compass reports its remaining time and plays a tick sound.
# Default: 60
# Range: 1 ~ 3600
copperCompassUpdateSeconds = 60
#Player-wide cooldown in Minecraft days after a copper compass tracking cycle ends.
# Default: 10
# Range: 0 ~ 3650
copperCompassCooldownDays = 10
